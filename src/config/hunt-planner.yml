app:
  name: Idaho Opportunity Explorer
  eyebrow: Idaho Fish and Game
  defaultBasemap: topo
  center: [-114.52, 45.5]
  zoom: 6
  disclaimer: Boundaries are for planning only. Verify current seasons, rules, closures, and legal descriptions before hunting.

speciesCatalog:
  - { id: deer, label: Deer, status: active }
  - { id: elk, label: Elk, status: active }
  - { id: pronghorn, label: Pronghorn, status: active }
  - { id: black-bear, label: Black Bear, status: active }
  - { id: moose, label: Moose, status: active, unavailableLabel: no 2026 API records }
  - { id: bighorn-sheep, label: Bighorn Sheep, status: active, unavailableLabel: no 2026 API records }
  - { id: mountain-goat, label: Mountain Goat, status: active, unavailableLabel: no 2026 API records }
  - { id: mountain-lion, label: Mountain Lion, status: planned, unavailableLabel: predator tools are planned }

spatialSearch:
  hourToMiles: 50
  proximityRelation: intersects
  disclaimer: Planning buffer only; not estimated travel or drive time.

dataProviders:
  opportunitySearch:
    label: AI opportunity search
    baseUrl: /api/opportunity-search
    status: active
    broker: Drupal
    modelPurpose: Translate natural language into validated filters and GIS layer selections
  huntPlanner:
    label: Hunt Planner API
    version: '1.1'
    baseUrl: /ifwis/huntplanner/api/1.1
    docUrl: https://idfg.idaho.gov/ifwis/api/?doc=/ifwis/huntplanner/api/1.1/doc.yaml
    status: active
    seasonWindow:
      start: '2026-01-01'
      end: '2026-12-31'
    pageSize: 25
    catalogLimit: 5000
    huntAreaLayerUrl: https://gisportal-idfg.idaho.gov/hosting/rest/services/Hunting/MapServer/0
  fishingPlanner:
    label: Fishing Planner API
    version: '2.0'
    baseUrl: /ifwis/fishingplanner/api/2.0
    docUrl: https://idfg.idaho.gov/ifwis/api/?doc=/ifwis/fishingplanner/api/2.0/doc.yaml
    status: planned

activities:
  - id: big-game
    label: Big game
    description: Deer, elk, pronghorn, moose, sheep and goat
    icon: deer
    accent: '#9b5d32'
    suggestedLayers: [game-units, elk-zones, controlled-hunts, motorized-rules]
  - id: access
    label: Access
    description: Public access, roads, trails and campgrounds
    icon: route
    accent: '#367257'
    suggestedLayers: [access-yes, wmas, surface-management, campgrounds]
  - id: turkey-upland
    label: Turkey
    description: Future opportunity type
    icon: bird
    accent: '#83672d'
    disabled: true
    suggestedLayers: [game-units, upland-restrictions, access-yes]
  - id: waterfowl
    label: Waterfowl
    description: Future opportunity type
    icon: waves
    accent: '#287d86'
    disabled: true
    suggestedLayers: [waterfowl-restrictions, access-yes, wmas]
  - id: predator
    label: Predators
    description: Future opportunity type
    icon: paw
    accent: '#705b89'
    disabled: true
    suggestedLayers: [wolf-zones, furbearer-restrictions, access-yes]

layerGroups:
  - id: hunt
    label: Hunts & boundaries
    description: Start with the legal geography of the hunt.
    layers:
      - id: game-units
        label: Game management units
        description: Numbered statewide game units
        type: feature
        url: https://services.arcgis.com/FjJI5xHF2dUPVrgK/ArcGIS/rest/services/GameManagementUnits/FeatureServer/0
        defaultVisible: true
        opacity: 0.72
        signals: [hunt, unit, area, boundary, species, compare, statewide]
        identify:
          category: Hunts & boundaries
          titlePrefix: GMU
          titleFields: [NAME]
          fields:
            - { field: Elk_Zone, label: Elk zone }
      - id: elk-zones
        label: Elk management zones
        description: Elk zone boundaries
        type: feature
        url: https://services.arcgis.com/FjJI5xHF2dUPVrgK/ArcGIS/rest/services/ElkManagementZones/FeatureServer/0
        defaultVisible: false
        opacity: 0.68
        signals: [elk, hunt, zone, boundary, management]
        identify:
          category: Hunts & boundaries
          titlePrefix: Elk zone
          titleFields: [NAME, Zone, ZONE]
      - id: wolf-zones
        label: Wolf management zones
        description: Wolf zone boundaries
        type: feature
        url: https://services.arcgis.com/FjJI5xHF2dUPVrgK/ArcGIS/rest/services/Wolf_Management_Zones/FeatureServer/0
        defaultVisible: false
        opacity: 0.68
        signals: [wolf, predator, hunt, zone, boundary]
        identify:
          category: Hunts & boundaries
          titlePrefix: Wolf zone
          titleFields: [NAME, Zone, ZONE]
      - id: controlled-hunts
        label: Controlled hunt areas
        description: Current service; season-year filtering is the next integration step
        type: map-image
        url: https://gisportal-idfg.idaho.gov/hosting/rest/services/Apps/HuntPlanner/MapServer
        sublayers: [4]
        defaultVisible: false
        opacity: 0.78
        signals: [controlled, draw, permit, hunt, opportunity, boundary]
        identify:
          category: Hunts & boundaries
          titlePrefix: Hunt area
          titleFields: [HuntArea, AREA, Area, NAME]
          maxResults: 1
          orderByFields: [Year DESC]
          fields:
            - { field: BigGame, label: Species }
            - { field: Year, label: Season }

  - id: rules
    label: Rules & restrictions
    description: Areas with special restrictions or closures.
    layers:
      - id: motorized-rules
        label: Motorized vehicle hunting rule
        description: Units with motorized hunting restrictions
        type: feature
        url: https://services.arcgis.com/FjJI5xHF2dUPVrgK/ArcGIS/rest/services/GMUsWithMotorizedHuntingRules/FeatureServer/0
        defaultVisible: false
        opacity: 0.62
        signals: [motor, motorized, road, vehicle, restriction, access]
        identify:
          category: Rules & restrictions
          titlePrefix: GMU
          titleFields: [NAME]
          note: Motorized vehicle hunting rules apply in this unit. Check current exceptions and dates.
      - id: upland-restrictions
        label: Upland game & turkey restrictions
        description: Restricted or closed areas
        type: feature
        url: https://services.arcgis.com/FjJI5xHF2dUPVrgK/ArcGIS/rest/services/AreasWithHuntingRestrictions/FeatureServer/1
        defaultVisible: false
        opacity: 0.68
        signals: [turkey, upland, bird, restriction, closure]
        identify:
          category: Rules & restrictions
          titleFields: [Closed_Are, NAME]
          fields:
            - { field: Comments, label: Rule }
      - id: waterfowl-restrictions
        label: Waterfowl restrictions
        description: Restricted or closed areas
        type: feature
        url: https://services.arcgis.com/FjJI5xHF2dUPVrgK/ArcGIS/rest/services/AreasWithHuntingRestrictions/FeatureServer/3
        defaultVisible: false
        opacity: 0.68
        signals: [waterfowl, duck, goose, swan, restriction, closure]
        identify:
          category: Rules & restrictions
          titleFields: [Closed_Are, NAME]
          fields:
            - { field: Comments, label: Rule }
      - id: furbearer-restrictions
        label: Furbearer restrictions
        description: Restricted or closed areas
        type: feature
        url: https://services.arcgis.com/FjJI5xHF2dUPVrgK/ArcGIS/rest/services/AreasWithHuntingRestrictions/FeatureServer/4
        defaultVisible: false
        opacity: 0.68
        signals: [furbearer, trapping, predator, restriction, closure]
        identify:
          category: Rules & restrictions
          titleFields: [Closed_Are, NAME]
          fields:
            - { field: Comments, label: Rule }

  - id: access
    label: Land & access
    description: Understand where access may be available, then verify locally.
    layers:
      - id: access-yes
        label: Access Yes! properties
        description: Participating private properties with public access agreements
        type: feature
        url: https://gisportal-idfg.idaho.gov/hosting/rest/services/Access/Access/MapServer/1
        defaultVisible: true
        opacity: 0.82
        signals: [public, access, private, property, yes, walk-in]
        identify:
          category: Land & access
          titleFields: [NAME]
          fields:
            - { field: GeneralArea, label: Area }
            - { field: Acreage, label: Acres, format: number }
            - { field: AccessBegin, label: Opens, format: date }
            - { field: AccessEnd, label: Closes, format: date }
      - id: wmas
        label: Wildlife management areas
        description: IDFG-managed wildlife areas
        type: feature
        url: https://services.arcgis.com/FjJI5xHF2dUPVrgK/ArcGIS/rest/services/WildlifeManagementAreas/FeatureServer/0
        defaultVisible: false
        opacity: 0.74
        signals: [public, access, wildlife, management, habitat, camping]
        identify:
          category: Land & access
          titleFields: [Name, NAME]
          fields:
            - { field: Acres, label: Acres, format: number }
      - id: surface-management
        label: State & federal land management
        description: General land management context
        type: feature
        url: https://gis.blm.gov/idarcgis/rest/services/lands/BLM_ID_Surface_Management_Agency/FeatureServer/0
        defaultVisible: false
        opacity: 0.62
        signals: [public, land, blm, forest, state, ownership, access]
        identify:
          category: Land & access
          titleFields: [AGNCY_NAME, MGMT_AGNCY]
          fields:
            - { field: GIS_ACRES, label: Polygon acres, format: number }
      - id: campgrounds
        label: Forest Service recreation sites
        description: Constructed recreation and camping facilities
        type: feature
        url: https://apps.fs.usda.gov/arcx/rest/services/EDW/EDW_InfraRecreationSites_01/MapServer/0
        defaultVisible: false
        opacity: 0.9
        signals: [camp, camping, campground, overnight, access]
        identify:
          category: Nearby places
          titleFields: [RECAREANAME, FACILITYNAME, NAME]

  - id: support
    label: Regions & support
    description: Find the IDFG office and services responsible for a location.
    layers:
      - id: regions
        label: IDFG administrative regions
        description: Seven official regions used to route local support and services
        type: feature
        url: https://gisportal-idfg.idaho.gov/hosting/rest/services/Apps/QueryLayers/FeatureServer/2
        defaultVisible: false
        opacity: 0.72
        signals: [region, regional, office, contact, support, service]
        identify:
          category: Regional support
          titleFields: [NAME]
          note: This region determines the local IDFG office and region-specific support available for this location.
          link:
            label: Regional offices & contacts
            url: https://idfg.idaho.gov/offices

basemaps:
  - id: topo
    label: Topographic
  - id: satellite
    label: Satellite
  - id: streets-vector
    label: Roads
  - id: gray-vector
    label: Low contrast
